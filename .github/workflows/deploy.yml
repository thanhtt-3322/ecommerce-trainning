name: 🚀 Continuous deployment to EC2 AWS

on:
  push:
    branches:
      - main-1  # hoặc master

jobs:
  setup-laravel:
    name: Setup Laravel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: deployer:7.4.1
      
      - name: Check deployer version
        run: dep --version
  deploy:
    name: Deploy to EC2
    runs-on: self-hosted

    steps:
      - name: ⏬ Checkout code
        uses: actions/checkout@v4
        with:
          # Bắt buộc phải có fetch-depth: 0 để Git có đủ lịch sử commit
          fetch-depth: 0

      - name: Get All Changed Files from the Push Transaction
        id: all-changes
        run: |
          # So sánh commit trước (before) và commit cuối cùng (after/sha)
          # --name-only: chỉ in ra tên tệp đã thay đổi
          # echo sha before and current
          GIT_COMPARE_BASE="${{ github.event.before }}"
          echo "Before SHA: ${GIT_COMPARE_BASE}"

          # if before is all zeros, it means it's the first commit, so we compare with empty tree
          if [ "${{ github.event.before }}" = 0000000* ]; then
            echo "This is the first commit, comparing with empty tree"
            GIT_COMPARE_BASE=$(git rev-parse HEAD^1)
          fi
          echo "Using base SHA: $GIT_COMPARE_BASE"
          echo "Current SHA: ${{ github.sha }}"
          CHANGED_FILES=$(git diff --name-only $GIT_COMPARE_BASE ${{ github.sha }})

          # In danh sách tệp để kiểm tra
          echo "Files changed across all merged PRs:"
          echo "$CHANGED_FILES"

          # Lưu danh sách vào output để sử dụng trong các bước deploy tiếp theo
          # Thay thế ký tự xuống dòng bằng khoảng trắng hoặc dấu phẩy
          # Ví dụ: dùng khoảng trắng để dễ dùng trong script shell
          echo "changed_files_list=${CHANGED_FILES//$'\n'/ }" >> $GITHUB_OUTPUT

      - name: Display Changed Files
        run: |
          echo "Changed files in this push:"
          echo "${{ steps.all-changes.outputs.changed_files_list }}"

      - name: 🧰 Deploy app (stop → build → up)
        run: |
          echo "🚀 Starting containers..."
          docker compose up -d --pull always

          echo "✅ Deployment done."
          docker ps -a
